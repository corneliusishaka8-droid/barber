name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/barbars/package-lock.json
      - run: npm ci
        working-directory: frontend/barbars
      - run: npm run lint
        working-directory: frontend/barbars
      - run: npm run build
        working-directory: frontend/barbars

  backend:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: node --check server.js && node --check db.js && node --check passport.js && node --check routes/api.js
        working-directory: backend
