services:
  - type: web
    name: sarum-cut
    runtime: node
    plan: free
    buildCommand: npm ci --prefix frontend/barbars && npm run build --prefix frontend/barbars && npm ci --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/message
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_COOKIE_SAME_SITE
        value: lax
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
